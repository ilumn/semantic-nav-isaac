name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable source
        run: dev/isaac_sim/check_source.sh
