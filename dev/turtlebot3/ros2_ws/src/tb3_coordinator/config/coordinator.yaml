# ============================================================
# tb3_coordinator — coordinator_node + semantic_map_memory_node
# ============================================================

coordinator_node:
  ros__parameters:
    user_command_topic:       "/user_command"
    exploration_enabled_topic: "/exploration_enabled"
    query_command_topic:      "/semantic_query_node/command"
    query_result_topic:       "/semantic_query_node/selected_target"
    goal_pose_topic:          "/nav_goal_adapter_node/goal_pose"
    status_topic:             "~/status"
    navigate_to_pose_action:  "navigate_to_pose"
    nav_goal_timeout_sec:     60.0
    auto_resume_exploration:  true
    resume_delay_sec:         3.0
    enable_perception_sweep:  false  # real robot: the one-way 18 s spin winds the power tether; `semnav look` is used instead
    sweep_angular_vel:        0.4
    sweep_duration_sec:       18.0
    motion_initially_armed:   true
    readiness_required:       false
    readiness_scan_topic:     "/scan"
    readiness_odom_topic:     "/odom"
    readiness_image_topic:    "/camera/image_raw"
    readiness_camera_info_topic: "/camera/camera_info"
    readiness_topic_timeout_sec: 2.5
    readiness_status_period_sec: 2.0
    readiness_tf_timeout_sec: 0.2
    readiness_map_frame:      "map"
    readiness_odom_frame:     "odom"
    readiness_base_frame:     "base_link"
    readiness_camera_frame:   ""

semantic_map_memory_node:
  ros__parameters:
    input_topic:              "/semantic_map/live_compat_objects"  # real robot: fed by the YOLOE semantic map (detector_node/localizer are not launched)
    output_topic:             "/semantic_memory_markers"
    map_topic:                "/map"
    target_frame:             "map"
    tf_timeout:               0.3
    publish_rate:             1.0

    # ── Landmark matching ──────────────────────────────────
    merge_distance:           0.8
    candidate_merge_distance: 0.8

    # ── Promotion ──────────────────────────────────────────
    # Observations needed before a candidate becomes a persistent landmark.
    min_observations:         4   # compat updates arrive at 2 Hz: about 2 s of recent sightings

    # ── Obstacle island search ─────────────────────────────
    # Off on the real robot: observations already have a lidar range, and moving them up to
    # search_radius_cells onto the nearest obstacle put markers at the wrong distance.
    snap_to_obstacles:        false
    # Search window radius in grid cells around the observation.
    search_radius_cells:      20

    # Minimum occupancy value (0-100) to consider a cell as obstacle.
    occupied_threshold:       50

    # Minimum connected pixels for a valid island (1 = accept single pixels).
    min_island_pixels:        2

    # ── Candidate lifecycle ────────────────────────────────
    # Seconds before an unconfirmed candidate is discarded.
    candidate_timeout:        45.0

    # ── Observation quality ───────────────────────────
    # Reject observations farther than this from robot (in base_link).
    # Reduces landmark drift from noisy far-distance localizer output.
    max_observation_range_m:   6.0  # match SLAM max_laser_range on the real robot

    # ── Class-aware gating ────────────────────────────
    person_max_range_m:        2.5
    bench_max_range_m:         6.0
    stop_sign_max_range_m:     1.8
    person_min_observations:   3
    bench_min_observations:    4
    stop_sign_min_observations: 5
    wall_boundary_margin_m:   0.20
    excluded_classes:         ["person"]
    # Real room: neighbouring objects of different classes (chair at a table) must not suppress each other.
    cross_class_mutex_distance_m: 0.3
    allow_lidar_only_landmarks: true

    # ── Visualization ──────────────────────────────────────
    sphere_radius:            0.18
    text_offset_z:            0.45
