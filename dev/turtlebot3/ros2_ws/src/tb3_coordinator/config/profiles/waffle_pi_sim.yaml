# Isaac Sim profile for TurtleBot3 Waffle Pi semantic navigation.
#
# This file documents the ROS contract used by isaac_semantic_nav.launch.py.
# The launch files still expose these values as arguments so sim runs can be
# overridden without editing package configuration.

profile:
  name: waffle_pi_isaac_sim
  robot_model: waffle_pi
  simulator: isaac_sim_6_0_1
  use_sim_time: true
  requires_external_base_bringup: false

topics:
  map: /map
  costmap: /global_costmap/costmap
  odom: /odom
  scan: /scan
  image: /camera/image_raw
  camera_info: /camera/camera_info

frames:
  map: map
  odom: odom
  base: base_link
  camera: camera_rgb_frame

perception:
  detector_device: cuda:0
  camera_hfov_deg: 62.2
  camera_base_tx: 0.0
  camera_base_ty: 0.0
  camera_base_yaw_deg: 0.0

refiner:
  worker_enabled: true
  auto_run_when_buffer_ready: true
