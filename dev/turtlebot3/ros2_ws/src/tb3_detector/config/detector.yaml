# ============================================================
# tb3_detector  —  detector_node configuration
# ============================================================
# All values here are overridable via launch arguments or
# ros2 run ... --ros-args -p key:=value.

detector_node:
  ros__parameters:
    # ── Model ──────────────────────────────────────────────
    model_id: "nvidia/LocateAnything-3B"
    model_revision: "c32291ca5e996f5a7a485845b4f57a233936bba0"
    local_files_only: true             # fetch explicitly before launch

    # ── Inference ──────────────────────────────────────────
    device: "cuda:0"
    generation_mode: "hybrid"
    max_new_tokens: 2048

    # ── Class filter ───────────────────────────────────────
    # Open-vocabulary detector_label values from semantic_targets.yaml.
    # IMPORTANT: use detector_label strings, not semantic_name or simulator asset keys.
    #   semantic  →  detector_label  (see config/semantic_targets.yaml)
    #   table     →  "bench"
    #   stop_sign →  "stop sign"
    #   person    →  "person"
    class_filter: ["bench", "person", "stop sign"]

    # ── Topics ─────────────────────────────────────────────
    image_topic:        "/camera/image_raw"
    camera_info_topic:  "/camera/camera_info"
    detections_topic:   "~/detections"     # resolves to /detector_node/detections
    debug_image_topic:  "~/debug_image"    # resolves to /detector_node/debug_image

    # ── Debug ──────────────────────────────────────────────
    publish_debug_image: true
    queue_size: 1
