# ============================================================
# semantic_targets.yaml — Canonical semantic object registry
# ============================================================
#
# Single source of truth for the three naming layers used in this project:
#
#   semantic_name    Human-facing label. Used by the supported semantic
#                    query stack. This is what a user says:
#                    "go to the table".
#
#   detector_label   Locate Anything query label. Used in detector.yaml
#                    class_filter and returned with matching boxes.
#                    NEVER confuse with semantic_name — they may differ
#                    (e.g. semantic "table" ↔ detector label "bench").
#
#   isaac_asset      Stable asset key used by the Isaac scene manifest.
#                    This is a simulation-only field; semantic nodes ignore it.
#
# Baseline status: these labels are the configured Locate Anything prompts.
# The current Isaac acceptance run validated "person"; each changed scene or
# enabled target still needs rendered-sensor validation.
#
# To disable an object without deleting it: set enabled: false.
# Runtime query and semantic-map components read only enabled entries.
# ============================================================

semantic_targets:

  - semantic_name:   "table"
    detector_label:  "table"
    isaac_asset:     "table_marble"
    enabled:         true
    notes: >
      Locate Anything is prompted with "bench" for the marble/wooden table.
      The semantic_name is "table" for natural command phrasing.

  - semantic_name:   "stop_sign"
    detector_label:  "stop sign"
    isaac_asset:     "stop_sign"
    enabled:         false  # temporarily disabled for 2-target testing
    notes: >
      semantic_name uses underscore form "stop_sign" for consistency.
      detector_label remains "stop sign" (COCO label with space).
      Replaces old "traffic light" / "stop_light" (broken materials).
      The Isaac scene keeps this target optional for the two-target baseline.

  - semantic_name:   "person"
    detector_label:  "person"
    isaac_asset:     "person_standing"
    enabled:         true
    notes: >
      Direct label match. Highest detection confidence of the three targets.
      Optimise scene layout to place person centred in camera FOV first.
  - semantic_name:   "bottle"
    detector_label:  "bottle"
    enabled:         true
    notes: >
      Real-robot test target. Use an upright bottle at least ~25 cm tall so the
      LDS-02 scan plane (~18 cm above the floor) can range it for grounding.
  - semantic_name:   "chair"
    detector_label:  "chair"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "desk"
    detector_label:  "desk"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "couch"
    detector_label:  "couch"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "door"
    detector_label:  "door"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "cabinet"
    detector_label:  "cabinet"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "backpack"
    detector_label:  "backpack"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "box"
    detector_label:  "box"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).
  - semantic_name:   "trash"
    detector_label:  "trash can"
    enabled:         true
    notes: >
      Real-robot indoor target (needs to reach the ~18 cm lidar plane to be grounded).

  - semantic_name:   "soda"
    detector_label: "soda can"
    enabled:         true
    notes: >
      A can; named "soda" because the query parser treats "can" as a filler word
      ("go to the soda can" -> soda).
